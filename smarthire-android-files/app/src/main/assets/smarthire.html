<script>
/* ===== Utilities ===== */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const fD=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const chips=(a,c='')=>(a||[]).map(s=>`<span class="chip ${c}">${esc(s)}</span>`).join('');
const csv=s=>[...new Set(String(s).split(',').map(x=>x.trim()).filter(Boolean))];
async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sh|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m,e){const d=document.createElement('div');d.className=e?'err':'';d.textContent=tr(m);$('#toast').append(d);setTimeout(()=>d.remove(),3500)}
function modal(h){closeM();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="card" role="dialog" aria-modal="true">${h}</div>`;o.onclick=e=>{if(e.target==o)closeM()};document.body.append(o)}
const closeM=()=>$('#ov')?.remove();let CB;const ask=(m,cb)=>{CB=cb;modal(`<p>${esc(m)}</p><div class="row"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn danger" onclick="closeM();CB()">Confirm</button></div>`)};
/* ===== Database layer (localStorage = demo DB; swap for a real SQL API) ===== */
const ST=['Applied','Under Review','Shortlisted','Interview Scheduled','Selected','Rejected'];

async function seed(){const pw=await hash('Demo@123'),now=Date.now(),D=864e5;
 const d={users:[{id:'a1',name:'Admin',email:'admin@smarthire.demo',pw:await hash('Admin@123'),role:'admin',active:1,created:now-200*D}],seekers:{},companies:{},jobs:[],apps:[],notifs:[],saved:[],set:{requireVerify:true}};
 'Sree Varun V,Priya Raman,Karthik S,Divya Lakshmi,Arjun Mehta,Meena K,Rahul Verma,Ananya R,Vignesh P,Nisha Thomas'.split(',').forEach((n,i)=>{const id='s'+i;d.users.push({id,name:n,email:i?n.split(' ')[0].toLowerCase()+'@smarthire.demo':'seeker@smarthire.demo',pw,role:'seeker',active:1,created:now-(150-i*14)*D});
  d.seekers[id]={phone:'984000'+(1000+i),loc:CITIES[i%7],obj:'Aspiring professional looking to grow in tech.',skills:i?[...new Set([0,1,2,3].map(k=>SK[(i*3+k*2)%16]))]:['Python','SQL','Machine Learning','HTML','CSS','Java'],exp:i%3,edu:"Bachelor's Degree",certs:'',projects:'',langs:'English, Tamil',prefRole:'Python Developer',prefLoc:'Chennai',salary:'4-6 LPA',resume:i<6?{name:n.split(' ')[0]+'_Resume.pdf'}:null}});
 const cn=['TechNova Solutions','DataBridge Analytics','CloudNest Technologies','Webcraft Studio','InfoSphere Systems'];
 cn.forEach((n,i)=>{const id='e'+i;d.users.push({id,name:n+' HR',email:i?'hr'+i+'@smarthire.demo':'employer@smarthire.demo',pw,role:'employer',active:1,created:now-(120-i*10)*D});d.companies[id]={name:n,industry:'Information Technology',loc:CITIES[i],web:'https://example.com',desc:'Sample company for demonstration.',size:'51-200',year:2010+i,verified:i<4?'approved':'pending'}});
 const T=[['Junior Python Developer',['Python','SQL','Machine Learning']],['Data Analyst',['SQL','Excel','Power BI','Python']],['Frontend Developer',['React','JavaScript','HTML','CSS']],['Backend Developer',['Node.js','SQL','Docker']],['Data Scientist',['Python','Machine Learning','Statistics','Pandas']],['Java Developer',['Java','SQL','Docker']],['Cloud Engineer',['AWS','Docker','Python']],['Django Developer',['Python','Django','SQL']],['Full Stack Developer',['React','Node.js','JavaScript','SQL']],['ML Intern',['Python','Pandas','Machine Learning']]];
 for(let i=0;i<20;i++){const t=T[i%10],e='e'+(i%5);d.jobs.push({id:'j'+i,eid:e,title:t[0],dept:'Engineering',loc:CITIES[(i*3)%7],sal:['₹4–6 LPA','₹6–9 LPA','₹3–5 LPA','₹8–12 LPA'][i%4],type:i%5==4?'Internship':i%7==3?'Part Time':'Full Time',mode:['On-site','Hybrid','Remote'][i%3],exp:i%3,vac:2,skills:t[1],desc:'Join our team to build real-world products. This is sample demo data.',resp:'Develop features, collaborate with the team, write clean code.',qual:"Bachelor's degree in CS or related field.",ben:'Health insurance, flexible hours, learning budget.',status:e=='e4'?'draft':'active',posted:now-(i*2+1)*D})}
 const mk=(sid,jid,st,i)=>{const h=st=='Rejected'?['Applied','Under Review','Rejected']:ST.slice(0,ST.indexOf(st)+1),t=now-(i+1)*D;const a={id:'p'+d.apps.length,jid,sid,status:st,date:t,cover:'',sal:'',notice:'Immediate',hist:h.map((s,k)=>[s,t+k*36e5]),int:null};if(st=='Interview Scheduled')a.int={date:new Date(now+6*D).toISOString().slice(0,10),time:'10:30',type:'Online',link:'https://meet.example.com/demo',notes:'Sample interview'};d.apps.push(a);if(st!='Applied')d.notifs.push({id:uid(),uid:sid,text:`Update on ${J2(d,jid).title}: ${st}`,date:t,read:0})};
 const J2=(x,i)=>x.jobs.find(j=>j.id==i);mk('s0','j0','Interview Scheduled',3);mk('s0','j1','Under Review',5);
 for(let i=0,n=0;n<30&&i<200;i++){const s='s'+(i%10),j='j'+((i*7)%16);if(d.apps.some(a=>a.sid==s&&a.jid==j))continue;mk(s,j,ST[n%6],n);n++}
 return d}
/* ===== Matching & analysis engine (skill overlap; replace with AI API later) ===== */
const AI={match(have,need){const h=have.map(s=>s.toLowerCase()),m=need.filter(s=>h.includes(s.toLowerCase()));return{pct:need.length?Math.round(m.length/need.length*100):0,m,x:need.filter(s=>!m.includes(s))}},
 label:p=>p>=80?'Strong Match':p>=50?'Good Match':'Low Match',
 resume(p){const act=DB.jobs.filter(j=>j.status=='active'),roles=[...new Set(act.map(j=>j.title))].map(t=>({t,p:AI.match(p.skills,act.find(j=>j.title==t).skills).pct})).sort((a,b)=>b.p-a.p).slice(0,3).map(r=>r.t);
  const need={};act.forEach(j=>j.skills.forEach(s=>need[s]=(need[s]||0)+1));const gaps=Object.keys(need).filter(s=>!AI.match(p.skills,[s]).pct).sort((a,b)=>need[b]-need[a]).slice(0,4);
  return{skills:p.skills,roles,gaps,strong:p.skills.slice(0,2),score:Math.min(100,35+Math.min(p.skills.length*7,35)+(p.edu?8:0)+(p.obj?7:0)+(p.exp?5:0)+(p.resume?10:0))}}};
const pctProfile=p=>{const f=[p.phone,p.loc,p.obj,p.skills.length,p.edu,p.certs,p.projects,p.langs,p.prefRole,p.salary,p.resume,p.exp];return Math.round(f.filter(Boolean).length/f.length*100)};

 const m=j=>ME?.role=='seeker'?AI.match(S(ME.id).skills,j.skills).pct:0;if(Q.sort=='new')r.sort((a,b)=>b.posted-a.posted);if(Q.sort=='match'||Q.sort=='rel')r.sort((a,b)=>m(b)-m(a));if(Q.sort=='sal')r.sort((a,b)=>parseInt(b.sal.replace(/\D/g,''))-parseInt(a.sal.replace(/\D/g,'')));

const P={

return pub(`<section class="hero" style="max-width:1100px"><div class="g2" style="align-items:center;text-align:left"><div><span class="chip">AI-powered job matching</span><h1>Find the Right Opportunity. <span class="logo">Build Your Future.</span></h1><p class="mut">SmartHire connects skilled job seekers with the right employers using intelligent job matching.</p>
